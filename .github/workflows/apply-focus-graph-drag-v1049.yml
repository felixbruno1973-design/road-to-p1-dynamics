name: Apply Focus graph drag V1.0.49

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-focus-graph-drag-v1049.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          if 'V1.0.49 — déplacement manuel du curseur jaune' in text:
              raise SystemExit(0)
          text = text.replace('<title>Road to P1 Dynamics — Phase 1 V1.0.48</title>', '<title>Road to P1 Dynamics — Phase 1 V1.0.49</title>', 1)
          text = text.replace('<div class="ver">PHASE 1 · V1.0.48</div>', '<div class="ver">PHASE 1 · V1.0.49</div>', 1)
          text = text.replace('<div id="status" class="status"><strong>Prêt.</strong> V1.0.48 : Focus volant aligné à l’identique sur les modules Accélération et Freinage validés.</div>', '<div id="status" class="status"><strong>Prêt.</strong> V1.0.49 : curseur jaune des graphiques déplaçable manuellement et synchronisé avec les points A/B des trajectoires.</div>', 1)
          encoded = ''
          block = base64.b64decode(encoded).decode('utf-8')
          if '</body></html>' not in text:
              raise SystemExit('Fin du document introuvable')
          text = text.replace('</body></html>', block + '\n</body></html>', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit V1.0.49
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "V1.0.49 enable bidirectional focus graph cursor dragging"
          git push
