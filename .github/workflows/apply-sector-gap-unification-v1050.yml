name: Apply unified sector gaps V1.0.50

'on':
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sector-gap-unification-v1050.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unify sector gap source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          if 'V1.0.50 : écarts secteurs unifiés' in text:
              raise SystemExit(0)

          old = """   const sumA=zones.reduce((q,z)=>q+(z.a?.proxy||0),0),sumB=zones.reduce((q,z)=>q+(z.b?.proxy||0),0);\n   const officialA=n(c.la.ms),officialB=n(c.lb.ms);\n   zones.forEach(z=>{\n     if(z.invalid)return;\n     const ta=sumA?z.a.proxy/sumA*officialA:officialA/Math.max(1,zones.length),tb=sumB?z.b.proxy/sumB*officialB:officialB/Math.max(1,zones.length);\n     z.deltaMs=tb-ta; // positif = B plus lent\n     z.winner=Math.abs(z.deltaMs)<25?'equal':z.deltaMs>0?'A':'B';\n     z.loss=Math.abs(z.deltaMs);\n     z.diagnostic=diagnostic(z);\n   });\n   return zones;\n"""

          new = """   const sumA=zones.reduce((q,z)=>q+(z.a?.proxy||0),0),sumB=zones.reduce((q,z)=>q+(z.b?.proxy||0),0);\n   const officialA=n(c.la.ms),officialB=n(c.lb.ms);\n   const canonicalGains=(typeof sectorTimeGains==='function'?sectorTimeGains(c):[]);\n   zones.forEach(z=>{\n     if(z.invalid)return;\n     const ta=sumA?z.a.proxy/sumA*officialA:officialA/Math.max(1,zones.length),tb=sumB?z.b.proxy/sumB*officialB:officialB/Math.max(1,zones.length);\n     const canonicalSec=Array.isArray(canonicalGains)&&Number.isFinite(canonicalGains[z.z])?canonicalGains[z.z]:null;\n     z.deltaMs=canonicalSec==null?(tb-ta):canonicalSec*1000; // référence unique : sectorTimeGains quand disponible\n     z.winner=Math.abs(z.deltaMs)<0.5?'equal':z.deltaMs>0?'A':'B';\n     z.loss=Math.abs(z.deltaMs);\n     z.diagnostic=diagnostic(z);\n   });\n   return zones;\n"""

          if old not in text:
              raise SystemExit('Bloc analyse secteurs attendu introuvable')
          text = text.replace(old,new,1)
          text = text.replace('<title>Road to P1 Dynamics — Phase 1 V1.0.49</title>', '<title>Road to P1 Dynamics — Phase 1 V1.0.50</title>', 1)
          text = text.replace('<div class="ver">PHASE 1 · V1.0.49</div>', '<div class="ver">PHASE 1 · V1.0.50</div>', 1)
          text = text.replace('<div id="status" class="status"><strong>Prêt.</strong> V1.0.49 : curseur jaune des graphiques déplaçable manuellement et synchronisé avec les points A/B des trajectoires.</div>', '<div id="status" class="status"><strong>Prêt.</strong> V1.0.50 : écarts secteurs unifiés entre Pilotage global, Accélération, Freinage et Volant.</div>', 1)
          text = text.replace('</body></html>', '<!-- V1.0.50 : écarts secteurs unifiés -->\n</body></html>', 1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Commit V1.0.50
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "V1.0.50 unify sector gap calculations across analysis modules"
          git push
