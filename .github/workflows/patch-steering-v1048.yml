name: Patch Focus volant V1.0.48

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-steering-v1048.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align Focus volant with validated Focus modules
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_title = '<title>Road to P1 Dynamics — Phase 1 V1.0.47</title>'
          old_header = '<div class="ver">PHASE 1 · V1.0.47</div>'
          old_status = '<div id="status" class="status"><strong>Prêt.</strong> V1.0.47 : Focus freinage aligné à l’identique sur le module Accélération validé.</div>'
          assert old_title in text, 'Version de départ inattendue dans le titre'
          assert old_header in text, 'Version de départ inattendue dans l’en-tête'
          assert old_status in text, 'Statut V1.0.47 introuvable'
          assert 'V1.0.48 — Focus volant' not in text, 'Le correctif Volant V1.0.48 existe déjà'

          text = text.replace(old_title, '<title>Road to P1 Dynamics — Phase 1 V1.0.48</title>', 1)
          text = text.replace(old_header, '<div class="ver">PHASE 1 · V1.0.48</div>', 1)
          text = text.replace(old_status, '<div id="status" class="status"><strong>Prêt.</strong> V1.0.48 : Focus volant aligné à l’identique sur les modules Accélération et Freinage validés.</div>', 1)

          steering_block = r'''

<style>
/* V1.0.48 — Focus volant : miroir du module Accélération/Freinage validé */
#steeringPage .focus-sector-map-canvas{display:none!important}
#steeringPage .focusSatelliteMap{height:330px;border:1px solid #263246;border-radius:14px;overflow:hidden;background:#080c12}
#steeringPage .focus-live-values{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:7px 0 0}
#steeringPage .focus-live-value{padding:8px 10px;border:1px solid #2a374b;border-radius:10px;background:#070c13;text-align:center}
#steeringPage .focus-live-value small{display:block;color:#9aa7ba;font-size:9px;text-transform:uppercase;letter-spacing:.08em}
#steeringPage .focus-live-value strong{display:block;font-size:18px;margin-top:2px}
#steeringPage .focus-live-value.a{border-left:4px solid #f7f9fc}#steeringPage .focus-live-value.b{border-left:4px solid #ef2438}
#steeringPage .focus-sector-tab .sector-gain{display:block;margin-top:4px;font-size:12px;color:#f7f9fc}
#steeringPage .focus-sector-tab.gain{background:rgba(46,209,131,.10)}
#steeringPage .focus-sector-tab.loss{background:rgba(239,36,56,.10)}
#steeringPage .focusDataCanvas{display:block!important;width:100%;height:330px!important}
#steeringPage .focus-curve-legend{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;color:#c7d0dc;font-size:11px}
#steeringPage .focus-curve-legend span:before{content:'';display:inline-block;width:22px;height:3px;border-radius:9px;margin-right:6px;vertical-align:middle}
#steeringPage .focus-curve-legend .a:before{background:#f7f9fc}#steeringPage .focus-curve-legend .b:before{background:#ef2438}
#steeringPage .focus-map-tooltip{background:#0b1017;border:1px solid currentColor;border-radius:7px;box-shadow:0 2px 8px rgba(0,0,0,.45);font-weight:900;padding:3px 7px}
#steeringPage .focus-map-tooltip-a{color:#f7f9fc}
#steeringPage .focus-map-tooltip-b{color:#ef2438}
#steeringPage .focus-map-tooltip.leaflet-tooltip-top:before{border-top-color:currentColor}
#steeringPage .focus-map-tooltip.leaflet-tooltip-bottom:before{border-bottom-color:currentColor}
@media(max-width:900px){#steeringPage .focusSatelliteMap,#steeringPage .focusDataCanvas{height:260px!important}#steeringPage .focus-live-values{grid-template-columns:1fr 1fr}}
</style>
<script>
(function(){
 const pageId='steeringPage';
 let map=null,lineA=null,lineB=null,markerA=null,markerB=null,lastSector=-1,playStart=0,steerPlaying=false,steerRaf=0,steerCursor=0,steerSector=0;
 const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
 const num=v=>Number.isFinite(+v)?+v:0;
 function comp(){return (typeof comparison!=='undefined'&&comparison)||(typeof selectedComparison==='function'?selectedComparison():null)}
 function zones(c){try{return analyse(c)}catch(e){const b=(typeof sectorBoundaries!=='undefined'&&sectorBoundaries.length>1)?sectorBoundaries:[0,.2,.4,.6,.8,1];return b.slice(0,-1).map((v,i)=>({z:i,start:v,end:b[i+1],deltaMs:0,winner:'equal'}))}}
 function rows(lap){return typeof normalizedRows==='function'?normalizedRows(lap):(lap?.rows||[])}
 function sample(lap,z,p,key){const rr=rows(lap);if(!rr.length)return 0;const progress=z.start+(z.end-z.start)*clamp(p);if(typeof at==='function')return num(at(rr,progress,key));const f=progress*(rr.length-1),i=Math.floor(f),j=Math.min(rr.length-1,i+1),q=f-i;return num(rr[i]?.[key])+(num(rr[j]?.[key])-num(rr[i]?.[key]))*q}
 function gps(lap,z){const rr=rows(lap),i0=Math.max(0,Math.floor(z.start*(rr.length-1))),i1=Math.min(rr.length-1,Math.ceil(z.end*(rr.length-1)));return rr.slice(i0,i1+1).filter(r=>Number.isFinite(+r.lat)&&Number.isFinite(+r.lon)&&Math.abs(+r.lat)>1&&Math.abs(+r.lon)>1)}
 function point(arr,p){if(!arr.length)return null;const f=clamp(p)*(arr.length-1),i=Math.floor(f),j=Math.min(arr.length-1,i+1),q=f-i,a=arr[i],b=arr[j];return[+a.lat+(+b.lat-+a.lat)*q,+a.lon+(+b.lon-+a.lon)*q]}
 function build(){
   const host=document.querySelector('#steeringFocusShell');if(!host)return null;
   if(!host.dataset.steer48){host.dataset.steer48='1';host.dataset.ready='1';host.className='focus-sector-shell';host.innerHTML=`<div class="focus-sector-tabs"></div><div class="focus-sector-layout"><div class="focus-sector-map"><div class="pilotage-map-title"><h3>Carte satellite du secteur</h3><span>Trajectoires A et B</span></div><div class="focusSatelliteMap"></div><div class="focus-sector-controls"><button class="btn secondary focusPlay">▶ Lecture</button><button class="btn secondary focusRewind">↶ Début</button><input class="focusRange" type="range" min="0" max="1000" value="0"></div><div class="focus-sector-info"></div></div><div class="focus-sector-data"><div class="pilotage-map-title"><h3>Volant — tours A et B</h3><span>valeur capteur</span></div><canvas class="focusDataCanvas"></canvas><div class="focus-curve-legend"><span class="a legendA">Tour A · chrono —</span><span class="b legendB">Tour B · chrono —</span><span>Curseur jaune synchronisé</span></div><div class="focus-live-values"><div class="focus-live-value a"><small>Volant instantané A</small><strong class="liveA">—</strong></div><div class="focus-live-value b"><small>Volant instantané B</small><strong class="liveB">—</strong></div><div class="focus-live-value a"><small>Vitesse instantanée A</small><strong class="speedA">—</strong></div><div class="focus-live-value b"><small>Vitesse instantanée B</small><strong class="speedB">—</strong></div></div></div></div>`;
     host.addEventListener('click',e=>{const control=e.target.closest('.focusPlay,.focusRewind,[data-focus-sector]');if(!control)return;e.stopImmediatePropagation();const t=e.target.closest('[data-focus-sector]');if(t){steerPlaying=false;cancelAnimationFrame(steerRaf);steerSector=+t.dataset.focusSector;steerCursor=0;lastSector=-1;render();return}if(e.target.closest('.focusRewind')){steerPlaying=false;cancelAnimationFrame(steerRaf);steerCursor=0;render();return}if(e.target.closest('.focusPlay'))toggle()},true);
     host.addEventListener('input',e=>{if(e.target.classList.contains('focusRange')){e.stopImmediatePropagation();steerPlaying=false;cancelAnimationFrame(steerRaf);steerCursor=(+e.target.value||0)/1000;render()}},true);
   }
   return host;
 }
 function ensureMap(host){const el=host.querySelector('.focusSatelliteMap');if(map||typeof L==='undefined')return;map=L.map(el,{zoomControl:true,attributionControl:true});L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Tiles © Esri'}).addTo(map);lineA=L.polyline([],{color:'#f7f9fc',weight:4,dashArray:'9 7'}).addTo(map);lineB=L.polyline([],{color:'#ef2438',weight:4,dashArray:'9 7'}).addTo(map);markerA=L.circleMarker([0,0],{radius:7,color:'#090d13',weight:3,fillColor:'#f7f9fc',fillOpacity:1}).addTo(map).bindTooltip('A',{permanent:true,direction:'top',offset:[0,-10],className:'focus-map-tooltip focus-map-tooltip-a'});markerB=L.circleMarker([0,0],{radius:7,color:'#090d13',weight:3,fillColor:'#ef2438',fillOpacity:1}).addTo(map).bindTooltip('B',{permanent:true,direction:'bottom',offset:[0,10],className:'focus-map-tooltip focus-map-tooltip-b'});setTimeout(()=>map.invalidateSize(),0)}
 function drawChart(canvas,c,z){
   const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1,w=Math.max(320,r.width),h=Math.max(240,r.height);canvas.width=w*d;canvas.height=h*d;const x=canvas.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,w,h);x.fillStyle='#080c12';x.fillRect(0,0,w,h);const Lf=48,R=12,T=18,B=28,n=220,A=Array.from({length:n},(_,i)=>sample(c.la,z,i/(n-1),'steering')),Bv=Array.from({length:n},(_,i)=>sample(c.lb,z,i/(n-1),'steering')),vals=[...A,...Bv].filter(Number.isFinite);let mn=vals.length?Math.min(...vals):-1,mx=vals.length?Math.max(...vals):1;if(Math.abs(mx-mn)<.001){mn-=1;mx+=1}const pad=(mx-mn)*.08;mn-=pad;mx+=pad;
   x.strokeStyle='#263246';x.lineWidth=1;x.font='10px sans-serif';x.fillStyle='#9aa7ba';x.textAlign='right';for(let k=0;k<=4;k++){const y=T+(h-T-B)*k/4,v=mx-(mx-mn)*k/4;x.beginPath();x.moveTo(Lf,y);x.lineTo(w-R,y);x.stroke();x.fillText(v.toFixed(1),Lf-5,y+3)}
   const py=v=>T+(mx-v)/(mx-mn)*(h-T-B),plot=(arr,col)=>{x.strokeStyle=col;x.lineWidth=2.4;x.beginPath();arr.forEach((v,i)=>{const px=Lf+i/(n-1)*(w-Lf-R),yy=py(v);i?x.lineTo(px,yy):x.moveTo(px,yy)});x.stroke()};plot(A,'#f7f9fc');plot(Bv,'#ef2438');if(mn<0&&mx>0){x.strokeStyle='rgba(154,167,186,.55)';x.lineWidth=1;x.beginPath();x.moveTo(Lf,py(0));x.lineTo(w-R,py(0));x.stroke()}const px=Lf+clamp(steerCursor)*(w-Lf-R);x.strokeStyle='#f4bd4b';x.lineWidth=2;x.beginPath();x.moveTo(px,T);x.lineTo(px,h-B);x.stroke();x.fillStyle='#9aa7ba';x.textAlign='center';x.fillText('Progression dans le secteur',Lf+(w-Lf-R)/2,h-8);if(A.every(v=>Math.abs(v)<.0001)&&Bv.every(v=>Math.abs(v)<.0001)){x.fillStyle='#9aa7ba';x.font='13px sans-serif';x.fillText('Canal volant absent ou entièrement nul',Lf+(w-Lf-R)/2,h/2)}
 }
 function render(){const c=comp(),host=build();if(!c?.la||!c?.lb||!host)return;const chronoA=(typeof fmt==='function'?fmt(c.la.ms||c.la.timeMs):((c.la.ms||c.la.timeMs)?((c.la.ms||c.la.timeMs)/1000).toFixed(3):'—')),chronoB=(typeof fmt==='function'?fmt(c.lb.ms||c.lb.timeMs):((c.lb.ms||c.lb.timeMs)?((c.lb.ms||c.lb.timeMs)/1000).toFixed(3):'—'));const legA=host.querySelector('.legendA'),legB=host.querySelector('.legendB');if(legA)legA.textContent=`Tour A · chrono ${chronoA}`;if(legB)legB.textContent=`Tour B · chrono ${chronoB}`;const zs=zones(c),gains=(typeof sectorTimeGains==='function'?sectorTimeGains(c):[]),idx=Math.min(steerSector||0,zs.length-1),z=zs[idx];host.querySelector('.focus-sector-tabs').innerHTML=zs.map(q=>{const gainSec=Number.isFinite(gains[q.z])?gains[q.z]:num(q.deltaMs)/1000,dm=gainSec*1000,txt=Math.abs(gainSec)<.0005?'Écart 0,000 s':`${gainSec>0?'A gagne':'B gagne'} ${Math.abs(gainSec).toFixed(3)} s`;return `<button class="focus-sector-tab ${q.z===z.z?'active':''} ${dm>25?'gain':dm<-25?'loss':''}" style="border-top:4px solid ${['#4aa8ff','#2ed183','#f4bd4b','#ef2438','#ae70ff'][q.z%5]}" data-focus-sector="${q.z}"><small>Secteur ${q.z+1}</small><strong class="sector-gain">${txt}</strong></button>`}).join('');host.querySelector('.focusRange').value=Math.round(steerCursor*1000);ensureMap(host);const a=gps(c.la,z),b=gps(c.lb,z),all=[...a,...b];if(map){lineA.setLatLngs(a.map(q=>[+q.lat,+q.lon]));lineB.setLatLngs(b.map(q=>[+q.lat,+q.lon]));const pa=point(a,steerCursor),pb=point(b,steerCursor);if(pa){markerA.setLatLng(pa);markerA.setStyle({opacity:1,fillOpacity:1})}else markerA.setStyle({opacity:0,fillOpacity:0});if(pb){markerB.setLatLng(pb);markerB.setStyle({opacity:1,fillOpacity:1})}else markerB.setStyle({opacity:0,fillOpacity:0});if(all.length>2&&lastSector!==z.z){map.fitBounds(L.latLngBounds(all.map(q=>[+q.lat,+q.lon])),{padding:[18,18],maxZoom:19});lastSector=z.z}map.invalidateSize(false)}
   drawChart(host.querySelector('.focusDataCanvas'),c,z);const va=sample(c.la,z,steerCursor,'steering'),vb=sample(c.lb,z,steerCursor,'steering'),sa=sample(c.la,z,steerCursor,'speed'),sb=sample(c.lb,z,steerCursor,'speed');host.querySelector('.liveA').textContent=va.toFixed(1);host.querySelector('.liveB').textContent=vb.toFixed(1);host.querySelector('.speedA').textContent=sa.toFixed(1)+' km/h';host.querySelector('.speedB').textContent=sb.toFixed(1)+' km/h';host.querySelector('.focus-sector-info').textContent=`Secteur ${z.z+1} · ${Math.round(steerCursor*100)} % · volant A ${va.toFixed(1)} · B ${vb.toFixed(1)} · vitesse A ${sa.toFixed(1)} km/h · B ${sb.toFixed(1)} km/h`;host.querySelector('.focusPlay').textContent=steerPlaying?'❚❚ Pause':'▶ Lecture'}
 function toggle(){steerPlaying=!steerPlaying;cancelAnimationFrame(steerRaf);if(!steerPlaying){render();return}if(steerCursor>=.999)steerCursor=0;playStart=performance.now()-steerCursor*8000;const tick=t=>{if(!steerPlaying)return;steerCursor=clamp((t-playStart)/8000);render();if(steerCursor<1)steerRaf=requestAnimationFrame(tick);else{steerPlaying=false;steerCursor=1;render()}};steerRaf=requestAnimationFrame(tick)}
 const legacyRenderSectorFocus48=typeof renderSectorFocus==='function'?renderSectorFocus:null;
 if(legacyRenderSectorFocus48){renderSectorFocus=function(id,key,title,unit){if(id==='steeringPage'){render();return}return legacyRenderSectorFocus48.apply(this,arguments)};window.renderSectorFocus=renderSectorFocus}
 document.addEventListener('click',e=>{if(e.target.closest('[data-page="steeringPage"]'))setTimeout(render,80)},true);
 window.addEventListener('resize',()=>{if(document.querySelector('#steeringPage.active'))render()});
 const oldShow48=window.showPage;if(typeof oldShow48==='function'){window.showPage=function(id){oldShow48(id);if(id==='steeringPage')setTimeout(render,60)}}
})();
</script>
'''

          marker = '</body></html>'
          assert marker in text, 'Fin de document introuvable'
          text = text.replace(marker, steering_block + '\n' + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit V1.0.48
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "V1.0.48 align Focus volant with validated focus modules"
          git push
