name: Apply Focus volant V1.0.48

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-steering-v1048.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply steering patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          source = Path('.github/workflows/patch-steering-v1048.yml').read_text(encoding='utf-8')
          marker = "steering_block = r'''"
          if marker not in source:
              raise SystemExit('Bloc V1.0.48 introuvable')
          block = source.split(marker, 1)[1].split("'''", 1)[0]
          if 'V1.0.48 — Focus volant' in text:
              raise SystemExit(0)
          old_title = '<title>Road to P1 Dynamics — Phase 1 V1.0.47</title>'
          old_header = '<div class="ver">PHASE 1 · V1.0.47</div>'
          old_status = '<div id="status" class="status"><strong>Prêt.</strong> V1.0.47 : Focus freinage aligné à l’identique sur le module Accélération validé.</div>'
          if old_title not in text or old_header not in text or old_status not in text:
              raise SystemExit('Version V1.0.47 de départ inattendue')
          text = text.replace(old_title, '<title>Road to P1 Dynamics — Phase 1 V1.0.48</title>', 1)
          text = text.replace(old_header, '<div class="ver">PHASE 1 · V1.0.48</div>', 1)
          text = text.replace(old_status, '<div id="status" class="status"><strong>Prêt.</strong> V1.0.48 : Focus volant aligné à l’identique sur les modules Accélération et Freinage validés.</div>', 1)
          text = text.replace('</body></html>', block + '\n</body></html>', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit V1.0.48
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "V1.0.48 align Focus volant with validated focus modules"
          git push
